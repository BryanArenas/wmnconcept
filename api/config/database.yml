# PostgreSQL. Versions 9.5 and up are supported.
# Wind Mitigation Network — API database config.
#
# Local dev/test connect over the default UNIX domain socket as the OS role.
# Production is driven entirely by DATABASE_URL (Fly/Neon); the Solid adapters
# (queue/cache/cable) share the primary database via schema-scoped tables.

default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: wmn_development

test:
  <<: *default
  database: wmn_test

# Production reads DATABASE_URL. Solid Queue/Cache/Cable run in the primary
# database under their own migration paths so we ship a single Postgres.
production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    migrations_paths: db/cable_migrate
